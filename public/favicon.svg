<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!--
		AN monogram, matching the site header. The accent colour is the same
		--accent as the light theme in src/styles/global.css; it is hard-coded
		here because a favicon cannot read CSS variables. The solid tile reads
		on both light and dark browser chrome, so there is no dark variant.
	-->
	<rect width="64" height="64" rx="14" fill="#9a3412" />
	<text
		x="32"
		y="43"
		text-anchor="middle"
		font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
		font-size="29"
		font-weight="650"
		fill="#fdfdfc"
	>AN</text>
</svg>
